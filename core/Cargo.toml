[package]
name = "modbus-mqtt-bridge-core"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
defmt = { version = "1.2", optional = true }
rust-mqtt = { version = "0.6.0", default-features = false, features = ["v5"] }
rmodbus = { version = "0.13.0", features = ["heapless"], default-features = false }
error_set = { version = "0.9.2", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
heapless = "0.9.3"
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"

embassy-time = { version = "0.5.1", default-features = false, optional = true }
log = { version = "0.4.35", optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[features]
default = ["std", "tokio"]
embassy = ["dep:embassy-time", "defmt"]
defmt = ["dep:defmt", "embedded-io-async/defmt", "rust-mqtt/defmt", "embassy-time?/defmt", "embassy-time?/defmt-timestamp-uptime", "rmodbus/defmt"]
log = ["dep:log", "rust-mqtt/log", "embassy-time?/log"]
std = ["log", "embassy-time?/std"]
tokio = ["dep:tokio"]
