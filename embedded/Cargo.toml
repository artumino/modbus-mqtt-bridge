[package]
authors = ["Jacopo Libè <jacopo.libe@gmail.com>"]
edition = "2024"
name = "modbus-mqtt-bridge-embedded"
version = "0.1.0"

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet"] }
embassy-futures = { version = "0.1.2" }
embedded-nal-async = { version = "0.9.0" }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }

defmt = "1.2"
defmt-rtt = "1.3"

panic-probe = { version = "1.0", features = ["print-defmt"] }

static_cell = { version = "2" }
portable-atomic = { version = "1", features = ["critical-section"]} # Needed for `static_cell`

cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"

# Out dependencies
modbus-mqtt-bridge-core = { path = "../core", features = ["embassy"], default-features = false }
rust-mqtt = { version = "0.6.0", features = ["v5", "bump", "defmt"], default-features = false }
serde-json-core = { version = "0.7.0", features = ["defmt", "custom-error-messages"] }

# this lets you use `cargo fix`!
[[bin]]
name = "modbus-mqtt-bridge-embedded"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
