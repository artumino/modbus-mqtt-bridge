[package]
authors = ["Jacopo Libè <jacopo.libe@gmail.com>"]
edition = "2024"
name = "modbus-mqtt-bridge-bootloader"
version = "0.1.0"

[dependencies]
embassy-rp = { version = "0.10.0", features = ["rp2040"] }
embassy-boot-rp = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.7", features = ["set-vtor"] }

defmt = { version = "1.2", optional = true }
defmt-rtt = { version = "1.3", optional = true }

[features]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "embassy-boot-rp/defmt",
    "embassy-rp/defmt",
]

[[bin]]
name = "modbus-mqtt-bridge-bootloader"
test = false
bench = false

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
panic = "abort"
